<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1, h2 {
            color: #263238;
        }

        .form-section, .table-section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: #1976d2;
        }

        .delete-btn {
            background: #d32f2f;
        }

        .edit-btn {
            background: #388e3c;
            text-decoration: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #263238;
            color: white;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-section {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <!-- Employee Registration Form -->
    <div class="form-section">
        <h2>Register New Employee</h2>

        <form th:action="@{/employees}" th:object="${employee}" method="post">

            <div class="form-grid">

                <div>
                    <input type="text" th:field="*{fullName}"
                           placeholder="Full Name">
                    <p class="error" th:errors="*{fullName}"></p>
                </div>

                <div>
                    <input type="email" th:field="*{email}"
                           placeholder="Email Address">
                    <p class="error" th:errors="*{email}"></p>
                </div>

                <div>
                    <input type="text" th:field="*{phone}"
                           placeholder="Phone Number">
                    <p class="error" th:errors="*{phone}"></p>
                </div>

                <div>
                    <input type="text" th:field="*{department}"
                           placeholder="Department">
                    <p class="error" th:errors="*{department}"></p>
                </div>

                <div>
                    <input type="number" step="0.01" th:field="*{salary}"
                           placeholder="Salary">
                    <p class="error" th:errors="*{salary}"></p>
                </div>

            </div>

            <br>
            <button type="submit">Register Employee</button>

        </form>
    </div>

    <!-- Employee Details Table -->
    <div class="table-section">
        <h2>Employee Details</h2>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>

                <td>
                    <div class="actions">

                        <a class="edit-btn"
                           th:href="@{/employees/{id}/edit(id=${emp.id})}">
                            Edit
                        </a>

                        <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                              method="post">
                            <button type="submit" class="delete-btn"
                                    onclick="return confirm('Are you sure you want to delete this employee?')">
                                Delete
                            </button>
                        </form>

                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="7">No employees registered yet.</td>
            </tr>

            </tbody>
        </table>
    </div>

</div>

</body>
</html>
